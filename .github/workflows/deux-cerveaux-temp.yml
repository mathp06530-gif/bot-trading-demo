name: TEMP données backtest deux cerveaux
on:
  push:
    branches: [claude/project-thread-q0bzqi]
    paths: [.github/workflows/deux-cerveaux-temp.yml]
permissions:
  contents: write
jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Historique Capital.com (démo)
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          UNITES: HOUR_4,HOUR
          EPICS: GOLD,SILVER,BTCUSD
        run: python backtest/telecharger.py
      - name: Enregistrer les données sur la branche (jamais sur main)
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "bot-trading-demo"; git config user.email "bot-trading-demo@users.noreply.github.com"
          git add -f backtest/donnees/
          git commit -qm "TEMP données backtest deux cerveaux" && git push -q origin HEAD
