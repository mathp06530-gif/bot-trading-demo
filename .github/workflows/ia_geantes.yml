name: IA - essai des IA géantes (chargement et vitesse)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [ia/geantes/**, .github/workflows/ia_geantes.yml]

permissions:
  contents: write

concurrency:
  group: ia-geantes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
          key: ia-geantes-v1-${{ hashFiles('ia/geantes/familles.py') }}-${{ github.run_id }}
          restore-keys: ia-geantes-v1-
      - run: pip install -q numpy
      - name: Installer chaque famille dans son propre environnement
        run: bash ia/geantes/installer.sh 2>&1 | tail -40
      - name: Essai
        run: python -u ia/geantes/essai.py ia/geantes/ETAT.json
      - name: Enregistrer l'état
        if: always()
        run: |
          git config user.name "bot-trading-demo"
          git config user.email "bot-trading-demo@users.noreply.github.com"
          git add ia/geantes/ETAT.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "IA géantes : état du chargement"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep 5; done
