name: Lire une chaîne YouTube (étude de stratégie)
on:
  push:
    branches: [claude/project-thread-owfyot]
    paths: [.github/workflows/youtube.yml]
permissions:
  contents: write
jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U yt-dlp youtube-transcript-api
      - name: Liste des vidéos
        run: |
          mkdir -p etude_youtube/subs
          for t in videos shorts streams; do
            yt-dlp --flat-playlist --print "%(id)s	$t	%(title)s	%(duration)s" "https://www.youtube.com/@TimeoAuger/$t" >> etude_youtube/liste.tsv 2>> etude_youtube/erreurs.txt || true
          done
      - name: Sous-titres
        run: |
          cat > /tmp/tr.py <<'PY'
          import sys, os, time
          from youtube_transcript_api import YouTubeTranscriptApi
          api = YouTubeTranscriptApi()
          ok = 0
          for ligne in open("etude_youtube/liste.tsv", encoding="utf-8"):
              vid = ligne.split("\t")[0]
              dest = f"etude_youtube/subs/{vid}.txt"
              if os.path.exists(dest): continue
              try:
                  t = api.fetch(vid, languages=["fr", "en"])
                  open(dest, "w", encoding="utf-8").write(" ".join(s.text for s in t))
                  ok += 1
              except Exception as e:
                  print(vid, type(e).__name__, str(e)[:200])
              time.sleep(2)
          print("transcriptions:", ok)
          PY
          python /tmp/tr.py 2>&1 | tail -20
          cut -f1 etude_youtube/liste.tsv | sed 's#^#https://www.youtube.com/watch?v=#' > /tmp/urls.txt
          yt-dlp --skip-download --print "%(id)s	%(upload_date)s	%(view_count)s	%(description)j" \
            --extractor-args "youtube:player_client=default,mweb" --ignore-errors \
            -a /tmp/urls.txt > etude_youtube/descriptions.tsv 2>> etude_youtube/erreurs.txt || true
          wc -l etude_youtube/descriptions.tsv; ls etude_youtube/subs | wc -l; tail -5 etude_youtube/erreurs.txt
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etude_youtube && git commit -qm "Données de la chaîne étudiée" && git push
