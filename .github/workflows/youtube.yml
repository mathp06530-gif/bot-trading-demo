name: Lire une chaîne YouTube (étude de stratégie)
on:
  push:
    branches: [claude/project-thread-owfyot]
    paths: [.github/workflows/youtube.yml]
  workflow_dispatch:
jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: pip install -q -U yt-dlp
      - name: Liste des vidéos
        run: |
          mkdir -p out/subs
          curl -sL "https://www.youtube.com/feeds/videos.xml?channel_id=UCQVRo1K3J4KQjmBgfH_L9BQ" -o out/rss.xml || true
          for t in videos shorts streams; do
            yt-dlp --flat-playlist --print "%(id)s	%(title)s	%(duration)s" "https://www.youtube.com/@TimeoAuger/$t" >> out/liste.tsv 2>> out/erreurs.txt || true
          done
          wc -l out/liste.tsv
      - name: Sous-titres et descriptions
        run: |
          cut -f1 out/liste.tsv | sort -u | head -150 | sed 's#^#https://www.youtube.com/watch?v=#' > out/urls.txt
          yt-dlp --skip-download --write-auto-subs --write-subs --sub-langs "fr.*,fr" --sub-format vtt \
            --write-info-json --sleep-requests 1 --sleep-subtitles 2 --ignore-errors \
            -o "out/subs/%(upload_date)s_%(id)s.%(ext)s" -a out/urls.txt 2>> out/erreurs.txt || true
          ls out/subs | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: youtube
          path: out
