name: Bot de trading démo

on:
  schedule:
    - cron: "*/5 * * * *"    # toutes les 5 minutes (GitHub peut avoir quelques minutes de retard)
  workflow_dispatch:          # lancé à la main ou par les boutons de l'application
    inputs:
      action:
        description: "Commande pour le bot"
        type: choice
        default: analyser
        options: [analyser, pause, reprendre, fermer, activer, desactiver, lancer]
      strategie:
        description: "Stratégie visée par la commande"
        type: choice
        default: toutes
        options: [toutes, tendance_4h, rapide]

permissions:
  contents: write

concurrency:
  group: bot-trading
  cancel-in-progress: false

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Lancer un tour du bot
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          # Réglages modifiables :
          MARCHES: "BTCUSD"     # plusieurs marchés possibles, séparés par des virgules
          UNITE: "HOUR_4"       # stratégie principale : bougies de 4 h (testée en backtest)
          RISQUE_PCT: "1"       # stratégie principale : 1 % du capital risqué par trade
          TP_PARTIEL_ATR: "1"   # moitié de la position avec un TP à 1 × ATR ("0" = pas de TP)
          RAPIDE: "oui"         # stratégie rapide expérimentale (5 min) : "oui" ou "non"
          RISQUE_RAPIDE_PCT: "0.1"  # stratégie rapide : 0,1 % du capital risqué par trade
          ACTION: ${{ inputs.action }}
          STRATEGIE: ${{ inputs.strategie }}
        run: python -m bot.main

      - name: Enregistrer les résultats pour le tableau de bord
        if: always()
        run: |
          git config user.name "bot-trading-demo"
          git config user.email "bot-trading-demo@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Tour du bot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
