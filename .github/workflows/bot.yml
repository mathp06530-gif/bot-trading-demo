name: Bot de trading démo

on:
  workflow_dispatch:          # lancé à la main ou par les boutons de l'application
    inputs:
      action:
        description: "Commande pour le bot"
        type: choice
        default: analyser
        options: [analyser, pause, reprendre, fermer, activer, desactiver, lancer]
      strategie:
        description: "Stratégie visée par la commande"
        type: choice
        default: toutes
        options: [toutes, tendance_4h, rapide, actions_etf]

permissions:
  contents: write

concurrency:
  group: commandes
  cancel-in-progress: false

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Lancer un tour du bot
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          # Réglages modifiables :
          MARCHES: "BTCUSD"     # plusieurs marchés possibles, séparés par des virgules
          UNITE: "HOUR_4"       # stratégie principale : bougies de 4 h (testée en backtest)
          RISQUE_PCT: "1"       # stratégie principale : 1 % du capital risqué par trade
          TP_PARTIEL_ATR: "1"   # moitié de la position avec un TP à 1 × ATR ("0" = pas de TP)
          RAPIDE: "oui"         # stratégie rapide expérimentale (5 min) : "oui" ou "non"
          RISQUE_RAPIDE_PCT: "0.05" # stratégie rapide : 0,05 % du capital risqué par trade (≈ 10 € max)
          SOUS_BOTS: "TSLA,NVDA,AAPL,MSFT,GOOGL,SPY,QQQ,GLD,XLK,IWM"  # un sous-bot par action / ETF
          RISQUE_SOUS_BOT_PCT: "0.5"  # sous-bots : 0,5 % du capital risqué par trade
          PERTE_MAX_PCT: "10"   # garde-fou : coupe-circuit si -10 % depuis le plus haut
          PERTE_JOUR_PCT: "3"   # garde-fou : plus de nouvel ordre si -3 % dans la journée
          POSITIONS_MAX: "12"   # garde-fou : positions ouvertes au maximum
          RISQUE_TOTAL_PCT: "6" # garde-fou : perte maximale si tous les stops sont touchés
          ACTION: ${{ inputs.action }}
          STRATEGIE: ${{ inputs.strategie }}
        run: bash scripts/tour.sh
