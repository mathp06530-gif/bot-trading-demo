name: Bot de trading démo

on:
  workflow_dispatch:          # lancé à la main ou par les boutons de l'application
    inputs:
      action:
        description: "Commande pour le bot"
        type: choice
        default: analyser
        options: [analyser, pause, reprendre, fermer, activer, desactiver, lancer]
      strategie:
        description: "Stratégie visée par la commande"
        type: choice
        default: toutes
        options: [toutes, tendance_4h, cassure_4h, rapide, elan_4h, squeeze_4h]

permissions:
  contents: write

concurrency:
  group: commandes
  cancel-in-progress: false

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Lancer un tour du bot
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          # Les réglages sont dans reglages.env (relu à chaque tour).
          ACTION: ${{ inputs.action }}
          STRATEGIE: ${{ inputs.strategie }}
        run: bash scripts/tour.sh
