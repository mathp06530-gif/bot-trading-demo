name: TEMP vérif historique Capital
on:
  push:
    branches: [claude/project-thread-i231aw]
    paths: [backtest/verif_temp.py, .github/workflows/verif-temp.yml]
permissions:
  contents: read
jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
        run: python backtest/verif_temp.py
