name: TEMP backtest défauts Rapide
on:
  push:
    branches: [claude/project-thread-i231aw]
    paths: [backtest/rapide_defauts.py, .github/workflows/rapide-temp.yml]
permissions:
  contents: read
jobs:
  rapide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Historique Capital.com (démo)
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          UNITES: MINUTE_5,HOUR,HOUR_4
          EPICS: GOLD
        run: python backtest/telecharger.py
      - name: Backtest
        run: python backtest/rapide_defauts.py
