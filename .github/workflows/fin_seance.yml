name: IA - Confirmer la fin de séance à l'envers (historique, aucun ordre)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r ia/requirements.txt
      - name: Cache des prix (le même que les labos)
        uses: actions/cache/restore@v4
        with:
          path: donnees_ia
          key: ia-donnees-v1-
          restore-keys: ia-donnees-v1-
      - run: python ia/fin_seance.py donnees_ia ia/FIN_SEANCE.md
      - name: Enregistrer
        run: |
          git config user.name "bot-trading-demo"
          git config user.email "bot-trading-demo@users.noreply.github.com"
          git add ia/FIN_SEANCE.md
          git diff --cached --quiet && exit 0
          git commit -qm "IA : test de confirmation fin de séance"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep 7; done
