name: Backtest grande fouille du web

# Recherche du 26/11/2026 « retourne tout le web » : ~40 familles d'idées (calendrier, banques centrales, fixings,
# saisonnalités, retournements, momentum entre marchés, paires). Réglages choisis sur 2017-2021, jugés sur
# 2022-aujourd'hui, frais x 1,5, voisins, prix mélangés, Bonferroni. Ne passe AUCUN ordre.
# Résultat : backtest/resultats_web_large.json (+ .txt), enregistré sur la branche lancée.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [backtest/web_large.py, backtest/dates_annonces.json, .github/workflows/web_large.yml]

permissions:
  contents: write

concurrency:
  group: web-large-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web_large:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Cache des prix (10 ans)
        uses: actions/cache@v4
        with:
          path: donnees_web
          key: prix-web-large-v1-${{ github.run_id }}
          restore-keys: prix-web-large-v1-
      - name: Historique Capital.com démo (jour 41 marchés, 1 h 18 marchés)
        timeout-minutes: 90
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
        run: python -u backtest/web_large.py telecharger donnees_web
      - name: Backtests + contrôle sur prix mélangés
        run: python -u backtest/web_large.py donnees_web 2>&1 | tee backtest/resultats_web_large.txt
      - name: Enregistrer le bilan
        run: |
          git config user.name "bot-trading-demo"
          git config user.email "bot-trading-demo@users.noreply.github.com"
          git add backtest/resultats_web_large.json backtest/resultats_web_large.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Backtest grande fouille du web : bilan $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
