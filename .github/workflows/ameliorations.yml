name: Recherche améliorations (Cassure, Supertrend)

# Teste les idées de la recherche du 26/11/2026 (filtres de régime, taille selon la volatilité, corrélation or/argent,
# sorties, empilement, autres cryptos) : réglages choisis sur 2017-2021, jugés sur 2022-aujourd'hui (jamais vu),
# correction pour le nombre d'essais. Ne passe AUCUN ordre. Résultat : backtest/resultats_ameliorations.json.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [backtest/ameliorations.py, .github/workflows/ameliorations.yml]

permissions:
  contents: write

concurrency:
  group: ameliorations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Historique Capital.com (10 ans 4 h : or, argent, ETH, BTC, SOL, XRP, LTC)
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
        run: python -u backtest/ameliorations.py telecharger donnees_amelio
      - name: Tests des idées + contrôles anti-hasard
        run: python -u backtest/ameliorations.py donnees_amelio
      - name: Enregistrer le bilan
        run: |
          git config user.name "bot-trading-demo"
          git config user.email "bot-trading-demo@users.noreply.github.com"
          git add backtest/resultats_ameliorations.json
          git diff --cached --quiet && exit 0
          git commit -qm "Recherche améliorations : bilan $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
