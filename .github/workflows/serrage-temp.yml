name: TEMP backtest stop qui se resserre
on:
  push:
    branches: [claude/project-thread-i231aw]
    paths: [backtest/serrage.py, .github/workflows/serrage-temp.yml]
permissions:
  contents: read
jobs:
  serrage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Historique Capital.com (démo)
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          UNITES: HOUR_4,HOUR,MINUTE_5
          EPICS: GOLD,SILVER,BTCUSD
        run: python backtest/telecharger.py
      - name: Backtest
        run: python backtest/serrage.py
      - uses: actions/upload-artifact@v4
        with:
          name: serrage
          path: backtest/resultats_serrage.json
          retention-days: 7
