name: Backtest gains rapides (Fed, nuit, Williams, Kelly)

# Recherche du 26/11/2026 « gagner beaucoup en peu de temps » : trades d'événement (avant la Fed, achat de nuit),
# cassure de volatilité de Larry Williams, et taille des positions (Kelly, ruine, challenge prop firm).
# Réglages choisis sur 2017-2021, jugés sur 2022-aujourd'hui, contrôle sur prix au hasard. Ne passe AUCUN ordre.
# Résultat : backtest/resultats_asymetrie.json (enregistré sur la branche lancée).

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [backtest/asymetrie.py, .github/workflows/asymetrie.yml]

permissions:
  contents: write

concurrency:
  group: asymetrie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asymetrie:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Historique Capital.com démo (1 h, jour, 4 h ; 10 ans)
        timeout-minutes: 60
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
        run: python -u backtest/asymetrie.py telecharger donnees_asym
      - name: Backtests + contrôle sur prix au hasard
        run: python -u backtest/asymetrie.py donnees_asym 2>&1 | tee backtest/resultats_asymetrie.txt
      - name: Enregistrer le bilan
        run: |
          git config user.name "bot-trading-demo"
          git config user.email "bot-trading-demo@users.noreply.github.com"
          git add backtest/resultats_asymetrie.json backtest/resultats_asymetrie.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Backtest gains rapides : bilan $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
