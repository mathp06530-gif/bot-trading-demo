name: Backtest règles des formateurs (temporaire)

on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-t8gypm"]
    paths: [backtest/formateurs.py, .github/workflows/formateurs.yml]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Historique Capital.com or + argent (~10 ans)
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          EPICS: GOLD,SILVER
        run: python backtest/usine.py telecharger donnees_usine
      - name: Backtest
        run: python backtest/formateurs.py donnees_usine | tee backtest/resultats_formateurs.txt
      - name: Enregistrer
        run: |
          git config user.name "bot-trading-demo"
          git config user.email "bot-trading-demo@users.noreply.github.com"
          git add backtest/resultats_formateurs.json backtest/resultats_formateurs.txt
          git commit -qm "Backtest règles des formateurs : résultats" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
