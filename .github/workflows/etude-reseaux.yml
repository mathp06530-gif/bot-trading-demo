name: Étude « stratégies des réseaux » (backtest ponctuel, temporaire)

on:
  push:
    branches: [claude/project-thread-9j8i6a]
    paths: [backtest/reseaux.py, backtest/dukascopy.py, backtest/reseaux2.py, .github/workflows/etude-reseaux.yml]

permissions:
  contents: read

jobs:
  etude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bougies Capital.com (démo)
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          UNITES: HOUR_4,HOUR
          EPICS: GOLD,SILVER,BTCUSD
        run: python backtest/telecharger.py
      - name: Découpage des bougies 4 h de Capital.com (heures)
        run: python -c "import pandas as p; d=p.read_csv('backtest/donnees/GOLD_HOUR_4.csv'); print(p.to_datetime(d.date).dt.hour.value_counts().sort_index().to_dict())"
      - name: Backtest des stratégies des réseaux (2 ans Capital.com, déjà vus)
        run: python backtest/reseaux.py
      - name: 2e vague (2 ans Capital.com)
        run: python backtest/reseaux2.py
      - name: Données JAMAIS VUES par le bot (historique long Capital.com, coupé AVANT les 2 ans déjà utilisés)
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          EPICS: GOLD,SILVER,BTCUSD
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import backtest.telecharger as t
          t.DOSSIER = Path("backtest/donnees_longues")
          t.DEMANDES = {"HOUR_4": (240, 3650), "HOUR": (60, 3650)}
          t.principal()
          sortie = Path("backtest/donnees_anciennes")
          sortie.mkdir(exist_ok=True)
          for f in t.DOSSIER.iterdir():
              if f.suffix == ".csv":
                  d = pd.read_csv(f)
                  d = d[pd.to_datetime(d.date).dt.tz_localize(None) < "2025-01-24"]
                  d.to_csv(sortie / f.name, index=False)
                  print(f.name, len(d), "bougies jamais vues", d.date.min() if len(d) else "-", "->", d.date.max() if len(d) else "-")
              else:
                  (sortie / f.name).write_bytes(f.read_bytes())
          PY
      - name: Backtest sur les données JAMAIS VUES (2015 -> janvier 2025)
        env:
          ANS: "10"
        run: python backtest/reseaux.py backtest/donnees_anciennes
      - name: 2e vague sur les données JAMAIS VUES
        env:
          ANS: "10"
        run: python backtest/reseaux2.py backtest/donnees_anciennes
