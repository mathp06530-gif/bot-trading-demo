name: Labo trading manuel EUR/USD (aucun ordre)

# Teste 4 stratégies rapides faisables à la main sur EUR/USD (bougies 5 et 15 min Capital.com démo, vrai spread),
# réglages choisis sur la 1re période, jugés sur la 2e, contrôle prix mélangés. Résultat : backtest/MANUEL_EURUSD.md

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuel-eurusd
  cancel-in-progress: true

jobs:
  labo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r ia/requirements.txt matplotlib
      - name: Cache des prix EUR/USD
        uses: actions/cache/restore@v4
        with:
          path: donnees_ia
          key: manuel-eurusd-v1-${{ github.run_id }}
          restore-keys: manuel-eurusd-v1-
      - name: Prix EUR/USD (télécharge seulement s'il manque)
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
        run: |
          ls -la donnees_ia 2>/dev/null | grep EURUSD || true
          if [ ! -f donnees_ia/EURUSD_MINUTE_15.csv ]; then
            python -u - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from backtest import telecharger as t
          from bot.capital import CapitalDemo
          api = CapitalDemo(*(os.environ[n].strip() for n in ("CAPITAL_API_KEY", "CAPITAL_IDENTIFIER", "CAPITAL_PASSWORD")))
          api.connexion()
          t.DOSSIER = Path("donnees_ia"); t.DOSSIER.mkdir(exist_ok=True)
          t.telecharger(api, "EURUSD", "MINUTE_15", 15, 700)
          t.telecharger(api, "EURUSD", "MINUTE_5", 5, 365)
          PY
          fi
          wc -l donnees_ia/EURUSD_MINUTE_*.csv
      - name: Garder les prix en cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: donnees_ia
          key: manuel-eurusd-v1-${{ github.run_id }}
      - run: python -u backtest/manuel_eurusd.py donnees_ia backtest/MANUEL_EURUSD.md backtest/manuel_eurusd.json backtest/manuel_eurusd_images
      - run: |
          git config user.name "bot-trading-demo"
          git config user.email "bot-trading-demo@users.noreply.github.com"
          git add -A backtest/
          git diff --cached --quiet && exit 0
          git commit -qm "Labo trading manuel EUR/USD : résultats"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep 7; done
