<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c0e">
<title>Élan crypto · Bot de trading</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  main { max-width:1100px; margin:0 auto; padding:14px 20px 32px; }
  .alerte { border-left:2px solid var(--orange); background:rgba(217,162,60,.08); color:#e6cf9f; padding:7px 12px; font-size:12.5px; margin-bottom:10px; }
  .tuiles { display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-bottom:10px; background:var(--panneau); border:1px solid var(--bord); border-radius:var(--rayon); }
  .tuile { padding:10px 14px; border-left:1px solid var(--bord); }
  .tuile:first-child { border-left:0; }
  .tuile b { display:block; font-size:18px; font-weight:600; color:var(--clair); font-variant-numeric:tabular-nums; }
  .tuile span { color:var(--doux); font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; }
  #marches { background:var(--panneau); border:1px solid var(--bord); border-radius:var(--rayon); }
  .carte { padding:10px 14px; border-bottom:1px solid var(--bord); }
  .carte:last-child { border-bottom:0; }
  .carte b { color:var(--clair); font-weight:600; }
  .ligne { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .doux { color:var(--doux); font-size:12.5px; }
  .vert { color:var(--vert) !important; } .rouge { color:var(--rouge) !important; }
  h2 { font-size:13.5px; font-weight:600; color:var(--clair); margin:16px 0 8px; }
  .journal { background:var(--panneau); border:1px solid var(--bord); border-radius:var(--rayon); padding:0 14px; }
  .journal div { border-bottom:1px solid var(--bord); padding:6px 0; font-size:12.5px; }
  .journal div:last-child { border-bottom:0; }
  @media (max-width:760px) { main { padding:10px 10px 20px; } }
</style>
</head>
<body>
<script src="nav.js"></script>
<main>
  <div class="titre-page"><div><h1>Élan crypto</h1>
  <div class="sous-titre">Bot à part · 1 % par trade · Ethereum, Litecoin, Solana, XRP · bougies 4 h</div></div></div>
  <div class="alerte">Expérience : la stratégie a gagné sur les 4 derniers mois, mais sur 2 mois le hasard fait aussi bien. Ce bot ne touche pas à la Cassure ni à la Rapide.</div>
  <div class="tuiles">
    <div class="tuile"><b id="realise">–</b><span>Encaissé</span></div>
    <div class="tuile"><b id="latent">–</b><span>En cours</span></div>
    <div class="tuile"><b id="trades">–</b><span>Trades</span></div>
  </div>
  <div id="blocage"></div>
  <h2>Marchés</h2>
  <div id="marches"></div>
  <h2>Journal</h2>
  <div id="journal" class="journal"></div>
  <p class="doux" id="maj"></p>
</main>
<script>
const eur = x => (x >= 0 ? "+" : "") + x.toFixed(2).replace(".", ",") + " €";
const classe = x => x > 0 ? "vert" : x < 0 ? "rouge" : "";
const heure = s => s ? new Date(s).toLocaleString("fr-FR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "";
const echap = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("elan_crypto.json?t=" + Date.now()).then(r => r.json()).then(d => {
  const b = d.bilan || {realise:0, latent:0, trades:0};
  const r = document.getElementById("realise"); r.textContent = eur(b.realise); r.className = classe(b.realise);
  const l = document.getElementById("latent"); l.textContent = eur(b.latent); l.className = classe(b.latent);
  document.getElementById("trades").textContent = b.trades + (b.trades ? ` (${b.gagnants} gagnants)` : "");
  if (b.blocage) document.getElementById("blocage").innerHTML = `<div class="alerte">Pas de nouvelle position : ${echap(b.blocage)}</div>`;
  const ouvertes = Object.values(d.deals || {});
  document.getElementById("marches").innerHTML = Object.entries(d.marches || {}).map(([epic, m]) => {
    const p = ouvertes.find(o => o.epic === epic);
    const pos = p ? `<div class="ligne"><span>${p.direction === "BUY" ? "Achat" : "Vente"} à ${p.prix_entree}</span><b class="${classe(p.resultat)}">${eur(p.resultat || 0)}</b></div>` : "";
    return `<div class="carte"><div class="ligne"><b>${echap(m.nom || epic)}</b><span class="doux">${m.sens > 0 ? "élan en hausse" : m.sens < 0 ? "élan en baisse" : "neutre"}</span></div>
      ${pos}<div class="doux">${echap(m.action || "")} · ${echap(m.regle || "")}</div></div>`;
  }).join("") || '<p class="doux">Premier tour pas encore fait.</p>';
  document.getElementById("journal").innerHTML = (d.journal || []).slice(-30).reverse()
    .map(j => `<div><span class="doux">${heure(j.date)} ${echap(j.marche)}</span> ${echap(j.texte)}</div>`).join("");
  document.getElementById("maj").textContent = "Dernier tour : " + heure(d.dernier_tour);
}).catch(() => { document.getElementById("marches").innerHTML = '<p class="doux">Premier tour pas encore fait (toutes les 30 min).</p>'; });
</script>
</body>
</html>
